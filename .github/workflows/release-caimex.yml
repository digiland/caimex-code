# Builds caimex binaries for all platforms and publishes them to a GitHub
# Release (plus install.sh, so the curl one-liner works via
# releases/latest/download/install.sh), publishes the `caimex` npm package via
# trusted publishing, and builds the Caimex Code desktop app into the same
# release (installers + the latest*.yml files its auto-updater reads).
#
# Desktop builds are unsigned until signing secrets exist: macOS users must
# clear the quarantine flag, Windows shows SmartScreen. Signing switches on in
# packages/desktop/electron-builder.config.ts when CSC_LINK / APPLE_API_KEY
# (macOS) or AZURE_TRUSTED_SIGNING_* (Windows) are set.
#
# Trigger: push a tag like v1.0.0, or run manually with a version input.
#
# Upstream OpenCode workflows are parked in .github/workflows-upstream/ — they
# assume upstream's secrets, bots, and npm packages and must not run here.
name: Release Caimex Code

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

concurrency: release-caimex

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - run: bun install

      - name: Build binaries for all targets
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: latest
        run: ./build-caimex.sh

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            --title "Caimex Code $TAG" \
            --notes "Install: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | bash\` or \`npm i -g caimex\`" \
            || echo "release $TAG already exists, uploading assets"
          gh release upload "$TAG" packages/caimex/* install.sh --clobber

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm mint a signed provenance attestation for the published tarball,
      # so consumers can verify it was built by this workflow from this repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.x.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      # No token. npm verifies this workflow's OIDC identity against the trusted
      # publisher configured on the package (npmjs.com → caimex → Settings →
      # Trusted publisher: digiland/caimex-code, release-caimex.yml), and mints
      # provenance from the same exchange.
      #
      # npm deprecated 2FA-bypass access tokens for CI in July 2026 — direct
      # publishing from them is removed around January 2027 — so a token here
      # would be a credential to leak, rotate, and eventually replace anyway.
      - name: Publish caimex to npm
        working-directory: npm/caimex
        run: |
          # `npm pkg set`, not `npm version` — the latter errors with "Version
          # not changed" when re-running a release whose version is already in
          # package.json, which would fail the job for no reason.
          npm pkg set version="${{ needs.release.outputs.version }}"
          npm publish --access public

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          - host: macos-26-intel
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          - host: windows-2025
            target: aarch64-pc-windows-msvc
            platform_flag: --win --arm64
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
    runs-on: ${{ matrix.settings.host }}
    env:
      OPENCODE_CHANNEL: prod
      OPENCODE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - name: Install rpm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # Builds the bundled server (packages/opencode/dist/node), copies icons and
      # Linux metainfo, and stamps the release version into package.json.
      - name: Prepare
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          RUST_TARGET: ${{ matrix.settings.target }}

      - name: Build
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package
        working-directory: packages/desktop
        timeout-minutes: 60
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts

      - uses: actions/upload-artifact@v4
        with:
          name: caimex-desktop-${{ matrix.settings.target }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: latest-yml-${{ matrix.settings.target }}
          if-no-files-found: error
          path: packages/desktop/dist/latest*.yml

  desktop-publish:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/download-artifact@v4
        with:
          pattern: caimex-desktop-*
          path: ${{ runner.temp }}/desktop
          merge-multiple: true

      # One directory per target — finalize-latest-yml.ts reads them that way.
      - uses: actions/download-artifact@v4
        with:
          pattern: latest-yml-*
          path: ${{ runner.temp }}/latest-yml

      - name: Upload desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ needs.release.outputs.version }}" "${{ runner.temp }}"/desktop/* \
            --clobber --repo "$GITHUB_REPOSITORY"

      # Merges the per-arch latest*.yml files (the mac and Windows builds each
      # write their own) and uploads them, so electron-updater sees every arch.
      - name: Publish updater metadata
        run: bun packages/desktop/scripts/finalize-latest-yml.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          LATEST_YML_DIR: ${{ runner.temp }}/latest-yml
